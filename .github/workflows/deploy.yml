name: Build & Deploy frontend

# SU AN sadece elle (ilk testler). Dogrulaninca push: [main] eklenecek.
on:
  workflow_dispatch:

concurrency:
  group: deploy-zalusa-frontend
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mratsag/zalusa-frontend

jobs:
  # 1) GitHub-hosted runner: image build + GHCR push
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # NEXT_PUBLIC_API_URL build-time'da gomulur (public deger)
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.zalusa.com
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2) Self-hosted runner (sunucuda): GHCR'dan pull + compose up
  deploy:
    needs: build
    runs-on: [self-hosted, zalusa-frontend]
    permissions:
      contents: read
      packages: read
    steps:
      - name: GHCR pull + restart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          cd /home/zalusa
          docker compose pull zalusafrontend
          docker compose up -d zalusafrontend
          docker image prune -f
          docker logout ghcr.io
      - name: Health check
        run: |
          sleep 5
          curl -fsS --retry 8 --retry-delay 3 -o /dev/null http://localhost:3000 && echo " frontend OK"
